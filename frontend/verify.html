<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK-Authentic | Verifica</title>
    <link rel="stylesheet" href="style.css">
    <script src="assets/libs/ethers.js"></script>
    <script src="assets/libs/zokrates.js"></script>
    <style>
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ccc; }
        .tab { padding: 10px 20px; cursor: pointer; border: 1px solid transparent; border-bottom: none; }
        .tab.active { background: white; border-color: #ccc; border-bottom: 1px solid white; font-weight: bold; margin-bottom: -1px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="index.html">Home</a> | 
            <span id="adminLink" style="display:none;"><a href="admin.html">Admin Panel</a> | </span>
            <span id="addressDisplay" style="font-size: 0.8em; color: #666;"></span>
        </div>
        
        <h1>🔍 Verifica di Autenticità</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('manual')">Generazione Manuale</div>
            <div class="tab" onclick="switchTab('upload')">Carica Proof.json</div>
        </div>

        <div id="status"></div>

        <!-- TAB 1: MANUALE -->
        <div id="manual" class="tab-content active">
            <p>Inserisci i dati dell'orologio e il codice segreto.</p>
            <form id="verifyForm">
                <div class="form-group">
                    <label>Secret ID (Privato)</label>
                    <input type="password" id="secretId" placeholder="Es. 123456" required>
                </div>

                <div class="form-group"><label>Modello</label><select id="modello"></select></div>
                <div class="form-group"><label>Movimento</label><select id="movimento"></select></div>
                <div class="form-group"><label>Materiale Cassa</label><select id="cassa"></select></div>
                <div class="form-group"><label>Vetro</label><select id="vetro"></select></div>
                <div class="form-group"><label>Cinturino</label><select id="cinturino"></select></div>
                <div class="form-group"><label>Quadrante</label><select id="quadrante"></select></div>

                <button type="submit">Genera Proof & Verifica</button>
            </form>
        </div>

        <!-- TAB 2: UPLOAD -->
        <div id="upload" class="tab-content">
            <p>Carica il file <code>proof.json</code> generato esternamente.</p>
            <form id="uploadForm">
                <div class="form-group">
                    <label>File Proof.json</label>
                    <input type="file" id="proofFile" accept=".json" required>
                </div>
                <button type="submit">Verifica Proof sulla Blockchain</button>
            </form>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
    <script type="module" src="js/verify_app.js"></script>
</body>
</html>
