<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Autenticità</title>
    <link rel="stylesheet" href="style.css">
    <script src="assets/libs/ethers.js"></script>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="index.html">&larr; Torna alla Home</a>
        </div>
        
        <h1>Verifica Orologio</h1>
        <p style="margin-bottom: 30px; color: #666;">Carica il file della prova digitale (Proof) fornito al momento dell'acquisto per verificare l'autenticità sulla Blockchain.</p>
        
        <div id="status"></div>

        <div class="card">
            <form id="uploadForm">
                <div class="form-group">
                    <label>File Proof.json</label>
                    <input type="file" id="proofFile" accept=".json" required>
                </div>
                <button type="submit">Verifica Adesso</button>
            </form>
        </div>

        <div id="result"></div>
    </div>

    <!-- Modulo JS principale -->
    <script type="module" src="js/verify_app.js"></script>
</body>
</html>
