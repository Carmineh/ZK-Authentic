<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="assets/libs/ethers.js"></script>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="index.html">&larr; Home</a>
            <span id="addressDisplay" style="float: right; color: #999;"></span>
        </div>

        <h1>Dashboard Admin</h1>
        <p style="margin-bottom: 30px;">Registrazione nuovi asset digitali.</p>
        
        <div id="status"></div>

        <div class="card">
            <h3>Registra Nuovo Orologio</h3>
            <form id="registerForm">
                <div class="form-group">
                    <label>Digital Twin Hash</label>
                    <input type="text" id="manualHash" placeholder="Incolla hash..." required>
                </div>
                <div class="form-group">
                    <label>Note / Descrizione</label>
                    <textarea id="note" rows="2" placeholder="Dettagli prodotto"></textarea>
                </div>
                <button type="submit">Registra su Blockchain</button>
            </form>
        </div>

        <div class="card">
            <h3>Catalogo (On-Chain)</h3>
            <div id="productList">Caricamento...</div>
        </div>
    </div>

    <script type="module" src="js/admin_app.js"></script>
</body>
</html>
